name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check whitespace
        run: git diff --check

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            bash -n "$file"
          done < <(
            find . \
              -type f \
              \( -name '*.sh' -o -path './scripts/*' \) \
              -not -path './.git/*' \
              -not -path './scripts/.gitkeep' \
              -print |
            sort
          )

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find . \
              -type f \
              \( -name '*.sh' -o -path './scripts/*' \) \
              -not -path './.git/*' \
              -not -path './scripts/.gitkeep' \
              -print |
            sort
          )

          shellcheck \
            --shell=bash \
            --severity=warning \
            "${files[@]}"

      - name: Test bootstrap manifest validation
        run: ./tests/bootstrap-manifest.sh

  configuration:
    name: Configuration validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            echo "Validating ${file}"
            jq empty "$file"
          done < <(
            find . \
              -type f \
              -name '*.json' \
              -not -path './.git/*' \
              -not -path '*/__pycache__/*' \
              -print |
            sort
          )

      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            if [[ ! -s "$file" ]]; then
              echo "Skipping empty Compose file: ${file}"
              continue
            fi

            echo "Validating ${file}"
            docker compose -f "$file" config --quiet
          done < <(
            find compose \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print |
            sort
          )

  local-rag:
    name: Local RAG tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/local-rag

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/local-rag/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          CHROMA_PATH: ${{ runner.temp }}/local-rag/chroma
        run: |
          mkdir -p "$CHROMA_PATH"
          python -m pytest tests -q
