name: tailnet-router

services:
  tailnet-router:
    image: caddy:2-alpine
    container_name: tailnet-router
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../../configs/tailnet-router/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:18080/openclaw/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s