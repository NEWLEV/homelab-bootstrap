services:
  socket-proxy:
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://socket-proxy:2375/_ping | grep -qx OK
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  traefik:
    healthcheck:
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://127.0.0.1/ 2>&1 | grep -Eq 'HTTP/[0-9.]+ 30[12]'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s