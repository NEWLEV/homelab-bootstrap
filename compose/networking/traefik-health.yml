services:
  socket-proxy:
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://socket-proxy:2375/_ping | grep -qx OK
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  traefik:
    environment:
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: health
      TRAEFIK_ENTRYPOINTS_HEALTH_ADDRESS: :8082
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/ping | grep -qx OK"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s