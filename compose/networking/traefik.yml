name: traefik

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped

    environment:
      LOG_LEVEL: info
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      VERSION: 1
      POST: 0
      AUTH: 0
      SECRETS: 0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - socket

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /run
      - /tmp

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - socket-proxy

    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Tailscale Serve terminates HTTPS. This private HTTP entrypoint avoids
      # a second TLS hop and is reachable only from the local host.
      - --entrypoints.tailnet.address=:18080
      - --accesslog=true
      - --log.level=INFO

    ports:
      - "80:80"
      # Keep LAN HTTPS separate from Tailscale Serve's tailnet-side 443.
      - "${TRAEFIK_LAN_IP:-192.168.1.97}:443:443"
      - "127.0.0.1:18080:18080"

    volumes:
      - /srv/data/services/traefik/dynamic:/etc/traefik/dynamic:ro
      - /srv/data/services/traefik/certs:/certs:ro

    networks:
      - socket
      - proxy

    security_opt:
      - no-new-privileges:true

    labels:
      traefik.enable: "false"

networks:
  socket:
    internal: true

  proxy:
    external: true
