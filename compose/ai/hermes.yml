name: hermes

# Hermes is a separate assistant runtime beside OpenClaw. It keeps its own
# state directory and dashboard while reusing approved infrastructure such as
# Local RAG on the private Docker network.
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command:
      - gateway
      - run

    env_file:
      - ${HERMES_ENV_FILE:-/srv/data/services/hermes/hermes.env}

    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      OPENCLAW_REPO_PATH: /workspace/openclaw
      LOCAL_RAG_URL: http://local-rag-api:8080
      NLC_RAG_URL: ${HERMES_NLC_RAG_URL:-}
      LOCAL_RAG_TOKEN_FILE: /run/secrets/local_rag_api_token
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      API_SERVER_CORS_ORIGINS: "http://aisha:8000,http://100.106.201.14:8000,https://aisha.tail4553c9.ts.net"

    volumes:
      - /srv/data/services/hermes:/opt/data
      - /srv/data/git/homelab-bootstrap/workspaces/development/repo:/workspace/openclaw:ro

    secrets:
      - local_rag_api_token

    ports:
      - target: 9119
        published: "9119"
        host_ip: ${TAILNET_BIND_IP:-100.106.201.14}
        protocol: tcp
      - target: 8642
        published: "8642"
        host_ip: ${TAILNET_BIND_IP:-100.106.201.14}
        protocol: tcp

    networks:
      - hermes-private
      - rag-private

    security_opt:
      - no-new-privileges=true

    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "const http=require('http');
          const req=http.get('http://127.0.0.1:9119', res => process.exit(res.statusCode && res.statusCode < 500 ? 0 : 1));
          req.setTimeout(5000, () => { req.destroy(); process.exit(1); });
          req.on('error', () => process.exit(1));"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  hermes-private:
    driver: bridge
  rag-private:
    external: true
    name: local-rag_rag-private

secrets:
  local_rag_api_token:
    file: ${LOCAL_RAG_API_TOKEN_FILE:-/srv/data/services/local-rag/secrets/api-token}
