name: openclaw

# Deployment boundary for the OpenClaw runtime service
services:
  openclaw:
    labels:
      com.newlev.service: openclaw
      com.newlev.layer: deployment
      com.newlev.boundary: runtime
      # Aisha chat surface: same host as the dashboard, path-scoped, tailnet-gated.
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.aisha-chat.rule: "Host(`aisha.tail4553c9.ts.net`) && PathPrefix(`/aisha`)"
      traefik.http.routers.aisha-chat.entrypoints: "websecure"
      traefik.http.routers.aisha-chat.tls: "true"
      traefik.http.services.aisha-chat.loadbalancer.server.port: "18789"
    build:
      context: ../../services/openclaw

    image: openclaw:runtime
    container_name: openclaw
    restart: unless-stopped

    environment:
      OPENCLAW_CONFIG_DIR: /config
      OPENCLAW_STATE_DIR: /state
      OPENCLAW_SECRETS_FILE: /run/secrets/openclaw_env
      OPENCLAW_LOCAL_RAG_URL: http://local-rag-api:8080
      OPENCLAW_LOCAL_RAG_TOKEN_FILE: /run/secrets/local_rag_api_token
      # 0.0.0.0 is container-scoped: reachable only through attached Docker
      # networks. Traefik exposes just the /aisha path on the tailnet host.
      OPENCLAW_GATEWAY_BIND: 0.0.0.0
      OPENCLAW_GATEWAY_PORT: "18789"
      NODE_COMPILE_CACHE: /var/tmp/openclaw-compile-cache
      OPENCLAW_NO_RESPAWN: "1"

    volumes:
      - /srv/data/services/openclaw:/state
      - /srv/data/services/openclaw/config:/config
      - /srv/data/services/openclaw/workspace:/work

    secrets:
      - openclaw_env
      - local_rag_api_token

    networks:
      - openclaw-private
      - rag-private
      - proxy

    security_opt:
      - no-new-privileges=true

    read_only: true

    tmpfs:
      - /tmp
      - /var/tmp

    # Keep health checks tied to the runtime boundary only
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/openclaw-healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  openclaw_env:
    file: ${OPENCLAW_ENV_FILE:-/srv/data/services/openclaw/secrets.env}
  local_rag_api_token:
    file: ${LOCAL_RAG_API_TOKEN_FILE:-/srv/data/services/local-rag/secrets/api-token}

networks:
  openclaw-private:
    driver: bridge
  rag-private:
    external: true
  proxy:
    external: true
