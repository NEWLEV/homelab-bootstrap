name: local-rag

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-rag-qdrant
    restart: unless-stopped

    volumes:
      - /srv/data/services/local-rag/qdrant:/qdrant/storage

    networks:
      - rag-internal

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    container_name: local-rag-ollama
    restart: unless-stopped

    volumes:
      - /srv/data/services/local-rag/ollama:/root/.ollama

    networks:
      - rag-internal

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../../services/local-rag

    container_name: local-rag-api
    restart: unless-stopped

    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy

    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text

    volumes:
      - /srv/data/git/homelab-bootstrap:/sources/homelab-bootstrap:ro

    ports:
      - "127.0.0.1:8090:8080"

    networks:
      - rag-internal

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

networks:
  rag-internal:
    internal: true
