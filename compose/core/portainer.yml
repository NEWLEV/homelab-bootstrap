name: portainer

services:
  portainer:
    build:
      context: ../../services/portainer
      dockerfile: Dockerfile
    image: aisha-portainer:healthcheck
    container_name: portainer
    restart: unless-stopped

    ports:
      - "100.106.201.14:9000:9000"
      - "100.106.201.14:9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/data/services/portainer/data:/data

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - /bin/busybox
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9000/api/status
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
