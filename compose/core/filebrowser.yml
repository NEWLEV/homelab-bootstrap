name: filebrowser

services:
  filebrowser:
    image: gtstef/filebrowser:stable
    container_name: filebrowser
    user: "1000:1000"
    restart: unless-stopped

    ports:
      - "100.106.201.14:8080:80"

    volumes:
      - /srv/data:/srv
      # Workspace contents are visible but cannot modify OpenClaw state or skills.
      - /home/nlc/.openclaw/workspace:/openclaw-workspace:ro
      - /srv/data/services/filebrowser-quantum/data:/home/filebrowser/data
