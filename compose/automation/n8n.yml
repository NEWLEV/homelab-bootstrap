name: aisha-automation

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      # Tailscale Serve publishes the HTTPS route; n8n stays loopback-only.
      - "127.0.0.1:5678:5678"
    env_file:
      - ${N8N_ENV_FILE:-/srv/data/services/n8n/n8n.env}
    environment:
      N8N_HOST: ${N8N_HOST:-aisha.tail4553c9.ts.net}
      N8N_PORT: "5678"
      N8N_PROXY_HOPS: "1"
      N8N_PROTOCOL: https
      N8N_PATH: /n8n/
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-https://aisha.tail4553c9.ts.net/n8n/}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://aisha.tail4553c9.ts.net/n8n/}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      TZ: ${TZ:-America/New_York}
    volumes:
      - /srv/data/services/n8n/data:/home/node/.n8n
    networks:
      - automation
      - rag-private
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
networks:
  automation:
    name: aisha-automation
  rag-private:
    external: true
    name: local-rag_rag-private
