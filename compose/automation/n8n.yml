name: aisha-automation

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      # Tailnet-only operator access. Keep n8n off the public LAN surface.
      - "100.106.201.14:5678:5678"
    env_file:
      - ${N8N_ENV_FILE:-/srv/data/services/n8n/n8n.env}
    environment:
      N8N_HOST: ${N8N_HOST:-aisha}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://aisha:5678/}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://aisha:5678/}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      TZ: ${TZ:-America/New_York}
    volumes:
      - /srv/data/services/n8n/data:/home/node/.n8n
    networks:
      - automation

networks:
  automation:
    name: aisha-automation
